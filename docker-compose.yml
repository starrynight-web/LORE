services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lore_enterprise_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-lore-enterprise-dev-secret-key-2026}
      - DATABASE_URL=${DATABASE_URL:-postgres://lore:lore_secret@postgres:5432/lore_enterprise}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_ALWAYS_EAGER=False
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - TESSERACT_CMD=/usr/bin/tesseract
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-sentence-transformers}
      - BILLING_PROVIDER=${BILLING_PROVIDER:-local_dev}
      - SEED_DEMO=${SEED_DEMO:-true}
      - LORE_GRAPH_BACKEND=${LORE_GRAPH_BACKEND:-django_orm}
      - LORE_VECTOR_BACKEND=${LORE_VECTOR_BACKEND:-qdrant}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-lore_secret}
    volumes:
      - ./backend:/app
      - backend_media:/app/media
      - kuzu_data:/app/kuzu_storage
      - sqlite_data:/app/sqlite_storage
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false
      qdrant:
        condition: service_healthy
        required: false

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lore_enterprise_worker
    restart: unless-stopped
    command: celery -A lore_enterprise worker -l info --concurrency=2
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-lore-enterprise-dev-secret-key-2026}
      - DATABASE_URL=${DATABASE_URL:-postgres://lore:lore_secret@postgres:5432/lore_enterprise}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_ALWAYS_EAGER=False
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - TESSERACT_CMD=/usr/bin/tesseract
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-sentence-transformers}
      - LORE_GRAPH_BACKEND=${LORE_GRAPH_BACKEND:-django_orm}
      - LORE_VECTOR_BACKEND=${LORE_VECTOR_BACKEND:-qdrant}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-lore_secret}
    volumes:
      - ./backend:/app
      - backend_media:/app/media
      - kuzu_data:/app/kuzu_storage
      - sqlite_data:/app/sqlite_storage
    depends_on:
      - backend
      - redis

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lore_enterprise_beat
    restart: unless-stopped
    command: celery -A lore_enterprise beat -l info
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-lore-enterprise-dev-secret-key-2026}
      - DATABASE_URL=${DATABASE_URL:-postgres://lore:lore_secret@postgres:5432/lore_enterprise}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_ALWAYS_EAGER=False
      - LORE_GRAPH_BACKEND=${LORE_GRAPH_BACKEND:-django_orm}
      - LORE_VECTOR_BACKEND=${LORE_VECTOR_BACKEND:-qdrant}
    volumes:
      - ./backend:/app
      - backend_media:/app/media
      - kuzu_data:/app/kuzu_storage
      - sqlite_data:/app/sqlite_storage
    depends_on:
      - backend
      - redis

  mcp_server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lore_enterprise_mcp
    restart: unless-stopped
    command: python mcp_server.py --transport http --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-lore-enterprise-dev-secret-key-2026}
      - DATABASE_URL=${DATABASE_URL:-postgres://lore:lore_secret@postgres:5432/lore_enterprise}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - LORE_MCP_HOST=0.0.0.0
      - LORE_MCP_PORT=8001
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
      - backend_media:/app/media
      - kuzu_data:/app/kuzu_storage
      - sqlite_data:/app/sqlite_storage
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: lore_enterprise_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend

  postgres:
    image: pgvector/pgvector:pg16
    container_name: lore_enterprise_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=lore_enterprise
      - POSTGRES_USER=lore
      - POSTGRES_PASSWORD=lore_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lore -d lore_enterprise"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lore_enterprise_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: lore_enterprise_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: lore_enterprise_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # Enterprise Profile: Dedicated Clustered Neo4j Graph Database
  neo4j:
    image: neo4j:5-community
    container_name: lore_enterprise_neo4j
    restart: unless-stopped
    profiles:
      - enterprise
    environment:
      - NEO4J_AUTH=neo4j/lore_secret
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  qdrant_data:
  backend_media:
  minio_data:
  neo4j_data:
  kuzu_data:
  sqlite_data:
