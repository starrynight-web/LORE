services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lore_enterprise_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-lore-enterprise-dev-secret-key-2026}
      - DATABASE_URL=postgres://lore:lore_secret@db:5432/lore_enterprise
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_ALWAYS_EAGER=False
      - QDRANT_URL=http://qdrant:6333
      - TESSERACT_CMD=/usr/bin/tesseract
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-sentence-transformers}
      - BILLING_PROVIDER=${BILLING_PROVIDER:-local_dev}
      - SEED_DEMO=${SEED_DEMO:-true}
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lore_enterprise_worker
    restart: unless-stopped
    command: celery -A lore_enterprise worker -l info --concurrency=2
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-lore-enterprise-dev-secret-key-2026}
      - DATABASE_URL=postgres://lore:lore_secret@db:5432/lore_enterprise
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CELERY_ALWAYS_EAGER=False
      - QDRANT_URL=http://qdrant:6333
      - TESSERACT_CMD=/usr/bin/tesseract
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-sentence-transformers}
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    depends_on:
      - backend
      - redis
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lore_enterprise_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    container_name: lore_enterprise_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=lore_enterprise
      - POSTGRES_USER=lore
      - POSTGRES_PASSWORD=lore_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lore -d lore_enterprise"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lore_enterprise_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: lore_enterprise_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: lore_enterprise_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  qdrant_data:
  backend_media:
  minio_data:
